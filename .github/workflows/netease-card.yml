name: Refresh Netease Music Card

on:
  schedule:
    # 每天 UTC 0 点执行，可按需修改
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read  # 这里只需要读取，不需要写入

jobs:
  refresh-card:
    runs-on: ubuntu-latest
    steps:
      - name: Ping netease-music-card to refresh cache
        run: |
          curl -s -o /dev/null "https://netease-music-card.vercel.app/api?user_id=12387892505&type=recent"
