name: Refresh Netease Music Card

on:
  schedule:
    # 每天 UTC 0 点更新，可按需修改
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 这里只是简单触发一下，卡片是实时生成的，不需要额外提交
      # 如果你使用自建卡片服务，可以把生成的图片提交到仓库
      - name: Ping netease-music-card to refresh cache
        run: |
          curl -s -o /dev/null "https://netease-music-card.vercel.app/api?user_id=YOUR_NETEASE_USER_ID&type=recent"

      # 如果你希望用 API 获取数据后生成一个本地 SVG 并提交，参考备选方案
      # （这里先留空）
